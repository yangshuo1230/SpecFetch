[project]
name = "spec-offload-prefetch-study"
version = "0.1.0"
description = "Predictability experiments for speculative MoE and KV-cache prefetching"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.26",
  "huggingface-hub>=0.23",
  "numpy>=1.26,<2",
  "safetensors>=0.4",
  "torch>=2.4,<2.9",
  "transformers>=4.51,<4.52",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
